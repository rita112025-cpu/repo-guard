[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-guard"
version = "0.1.0"
description = "Git commit / push 前的資料外洩檢查 CLI（唯讀、不連網）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
repo-guard = "repo_guard.cli:console_main"

[tool.setuptools]
packages = ["repo_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
